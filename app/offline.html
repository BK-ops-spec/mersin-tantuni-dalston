<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Mersin Tantuni</title>
  <meta name="theme-color" content="#07130e">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .offline {
      min-height: 100dvh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 32px;
    }
    .offline h1 {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 400;
      line-height: 0.95;
      margin: 18px 0 12px;
    }
    .offline p {
      max-width: 320px;
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <div class="offline">
      <span class="app-eyebrow">Mersin · Dalston</span>
      <h1>You are offline.</h1>
      <p>The menu is saved for your next visit, but we could not reach the restaurant. Reconnect and try again, or call us.</p>
      <a class="app-btn" href="tel:+442079233797">Call 020 7923 3797</a>
      <a class="app-btn app-btn-ghost" href="./">Try again</a>
    </div>
  </div>
</body>
</html>
