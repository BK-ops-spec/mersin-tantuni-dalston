<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Dashboard — Mersin Tantuni Dalston</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07130e">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <div class="admin-top">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x=".5" y=".5" width="47" height="47" stroke="currentColor" opacity=".35"/>
          <path d="M9 41V23a15 15 0 0 1 30 0v18" stroke="currentColor" stroke-width="1.1"/>
          <path d="M16 41V25a8 8 0 0 1 16 0v16" stroke="currentColor" opacity=".55"/>
          <path d="M24 17v24" stroke="currentColor" opacity=".35"/>
        </svg>
        <span class="brand-word"><strong>Mersin</strong><span>Restaurant dashboard</span></span>
      </a>
      <div class="admin-toolbar-right">
        <span class="admin-updated" id="admin-updated"></span>
        <button class="admin-refresh" type="button" id="admin-refresh">Refresh</button>
        <button class="admin-refresh" type="button" id="admin-logout">Sign out</button>
      </div>
    </div>

    <section class="admin-login" id="admin-login" hidden>
      <h1>Sign in</h1>
      <p>
        Enter the admin token printed in the server console, or the one saved in
        <code>data/admin_token.txt</code>.
      </p>
      <form id="admin-login-form" novalidate>
        <div class="field">
          <label for="admin-token">Admin token</label>
          <input id="admin-token" name="token" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-error" id="admin-login-error" role="alert"></div>
        <button class="btn btn-block" type="submit">Open dashboard</button>
      </form>
    </section>

    <section id="admin-dashboard" hidden>
      <div class="admin-stats" id="admin-stats"></div>

      <div class="admin-toolbar">
        <div class="admin-tabs" role="tablist" aria-label="Dashboard sections">
          <button class="admin-tab active" type="button" role="tab" data-admin-tab="reservations">Reservations</button>
          <button class="admin-tab" type="button" role="tab" data-admin-tab="orders">Orders</button>
        </div>
      </div>

      <div class="admin-list" data-admin-panel="reservations" id="admin-reservations">
        <div class="admin-empty">Loading reservations…</div>
      </div>
      <div class="admin-list" data-admin-panel="orders" id="admin-orders" hidden>
        <div class="admin-empty">Loading orders…</div>
      </div>
    </section>
  </div>

  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
